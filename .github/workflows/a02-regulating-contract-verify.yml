name: Verify A02 Regulating Contract Revision

on:
  push:
    branches:
      - fix/a02-limited-regulating-triad-v0.1

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a02-limited-regulating-triad-v0.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply exact D5 revision and regression tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          evidence = Path('lib/content-rebuild/evidence.ts')
          text = evidence.read_text(encoding='utf-8')
          old = '''  if (
    subjectOutput === "limited" &&
    outputConstraint === "effective" &&
    constraintSubject === "limited"
  ) {
    return "output_constraint_regulating";
  }'''
          new = '''  if (
    (subjectOutput === "limited" &&
      outputConstraint === "effective" &&
      constraintSubject === "limited") ||
    (availability.subject === "limited" &&
      availability.output === "usable" &&
      availability.constraint === "limited" &&
      subjectOutput === "limited" &&
      outputConstraint === "limited" &&
      constraintSubject === "limited")
  ) {
    return "output_constraint_regulating";
  }'''
          if text.count(old) != 1:
              raise SystemExit(f'evidence replacement count={text.count(old)}')
          evidence.write_text(text.replace(old, new), encoding='utf-8')

          test_file = Path('tests/unit/content-rebuild/engine.test.ts')
          text = test_file.read_text(encoding='utf-8')
          marker = 'describe("A02 limited regulating triad contract"'
          if marker in text:
              raise SystemExit('A02 regulating tests already present')
          addition = r'''

describe("A02 limited regulating triad contract", () => {
  it("accepts the endpoint-qualified limited triad without sample-specific logic", () => {
    const facts: ChartFacts = {
      precision: "exact",
      missingPositions: [],
      seasonalStrength: {
        subject: "囚",
        peer: "囚",
        input: "死",
        output: "旺",
        resource: "死",
        constraint: "休",
      },
      occurrences: [
        {
          role: "subject",
          kind: "day_anchor",
          objectKey: "limited-triad-subject",
          originClusterKey: "limited-triad-subject-origin",
          hiddenStemProportion: null,
          rootOccurrence: false,
        },
        {
          role: "output",
          kind: "visible",
          objectKey: "limited-triad-output",
          originClusterKey: "limited-triad-output-origin",
          hiddenStemProportion: null,
          rootOccurrence: false,
        },
        {
          role: "constraint",
          kind: "visible",
          objectKey: "limited-triad-constraint",
          originClusterKey: "limited-triad-constraint-origin",
          hiddenStemProportion: null,
          rootOccurrence: false,
        },
      ],
    };

    const result = evaluateSingleCandidate({
      candidateId: "limited-regulating-triad",
      facts,
    });

    expect(result.nodeAvailability).toMatchObject({
      subject: "limited",
      output: "usable",
      constraint: "limited",
    });
    expect(result.dimensions.D2).toBe("output_visible_asymmetric");
    expect(result.dimensions.D5).toBe("output_constraint_regulating");
    expect(result.nearestNeighbor.comparisons.find(
      (comparison) => comparison.pair === "A01_A02",
    )?.result).toBe("right");
  });

  it("preserves F05, F07, and F08 frozen outcomes", () => {
    const established = profile("F05");
    const capacityFailure = profile("F07");
    const competition = profile("F08");

    expect(established.dimensions.D5).toBe("output_constraint_regulating");
    expect(established.coreMechanism).toBe("A02");
    expect(established.candidateState).toBe("established");

    expect(capacityFailure.nodeAvailability.output).toBe("limited");
    expect(capacityFailure.dimensions.D5).toBe("unresolved");
    expect(capacityFailure.coreMechanism).toBeNull();
    expect(capacityFailure.candidateState).toBe("candidate");

    expect(competition.dimensions.D5).toBe("shared_endpoint_competition");
    expect(competition.coreMechanism).toBeNull();
    expect(competition.candidateState).toBe("conflicted");
  });
});
'''
          test_file.write_text(text + addition, encoding='utf-8')
          PY

      - name: Full repository checks
        run: npm run check

      - name: Final whitespace and scope checks
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/a02-regulating-contract-verify.yml
          changed="$(git diff --name-only origin/main | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "lib/content-rebuild/evidence.ts
          tests/unit/content-rebuild/engine.test.ts"

      - name: Commit verified candidate
        shell: bash
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: accept endpoint-qualified limited A02 triad"
          git push origin HEAD:fix/a02-limited-regulating-triad-v0.1
